<!DOCTYPE HTML>
<html lang="fr"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice Collectif</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
<main class="container">
        
      <h1>Nos tarifs</h1>
      <div class="toggle">
       <span>Annuellement</span>
        <label class="switch">
            <input type="checkbox" id="toggle">
            <span class="slider"></span>
        </label>
        <span>Mensuel</span>
      </div>

      <!-- MA PARTIE ISIDORE -->

      <div class="grid">
      <section class="price-card">
            <h2 class="price-card__name">Basique</h2>
            <h3 class="price-card__price js-price-card__price">
                <span class="price-card__dollar">$</span>
                19,99
            </h3>
            <h3 class="price-card__price js-price-card__price" style="display: none;">
                <span class="price-card__dollar">$</span>
                199,99
            </h3>
            <ul class="price-card__list">
                 <li>500 Go de stockage</li>
                <li>2 utilisateurs autorisés</li>
                <li>Envoyez jusqu'à 3 Go</li>
            </ul>
            <a class="button" href="#">APPRENDRE PLUS</a>
        </section>
    </div>
       </main>
    <script src="script.js"></script>
</body>
</html>
