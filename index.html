<!DOCTYPE HTML>
<html lang="fr"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice Collectif</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
<main class="container">
        
      <h1>Nos tarifs</h1>
      <div class="toggle">
       <span>Annuellement</span>
        <label class="switch">
            <input type="checkbox" id="toggle">
            <span class="slider"></span>
        </label>
        <span>Mensuel</span>
      </div>

      <!-- MA PARTIE ISIDORE -->

      <div class="grid">
      <section class="price-card">
            <h2 class="price-card__name">Basique</h2>
            <h3 class="price-card__price js-price-card__price">
                <span class="price-card__dollar">$</span>
                19,99
            </h3>
            <h3 class="price-card__price js-price-card__price" style="display: none;">
                <span class="price-card__dollar">$</span>
                199,99
            </h3>
            <ul class="price-card__list">
                 <li>500 GB Storage</li>
                <li>2 Users Allowed</li>
                <li>Send up to 3 GB</li>
            </ul>
            <a class="button" href="#">APPRENDRE PLUS</a>
        </section>
    </div>

    <div class="hervé">
        <section class="carte_de_prix">
       <h2 class="nom_de_carte">Professional</h2>
       <h3 class="prix_de_carte"><span class="dollar">$</span>24.99</h3>
       <h3 class="prix_de_carte js" hidden><span class="dollar_1">$</span>249.99</h3>

       <ul class="liste_de_carde">
        <li>1 TB Storage</li>
        <li>5 Users Allowed</li>
        <li>Send up to 10 GB</li>
       </ul>

       <a class="btn_de_carte" href="#">LEARN MORE</a>

    </section>
    </div>
       </main>
    <script src="script.js"></script>
</body>
</html>
